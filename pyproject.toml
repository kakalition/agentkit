[project]
name = "agentkit"
version = "0.3.0"
description = "Opinionated, batteries-included building blocks for PydanticAI personal-assistant agents (CLI + Telegram, MCP + A2A, durable execution)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "agentkit" }]
dependencies = [
    "pydantic-ai>=2.55.0,<3",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "sqlalchemy-libsql>=0.2.0",
    "alembic>=1.14",
    "dbos>=3.2.0,<4",
    "fastmcp-slim[server]>=4.1.0,<5",
    "a2a-sdk>=1.2.2,<2",
    "aiogram>=3.15,<4",
    "typer>=0.15",
    "httpx>=0.28.1",
    "uvicorn>=0.32",
    "fastapi>=0.115",
    "telegramify-markdown>=1.4.0",
    "python-dateutil>=2.9",
    "babel>=2.16",
    "croniter>=6.0",
    "numpy>=2.4.6",
    "aiosqlite>=0.22.1",
    "semantic-text-splitter>=0.33.0",
    "pydantic-graph>=2.55.0",
    "genai-prices>=0.1.10",
    "cachetools>=7.2.1",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.5.0",
    "pyjwt>=2.8",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "prometheus-client>=0.20",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
observability = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
observability-phoenix = ["arize-phoenix>=8"]
prices = ["yfinance>=0.2.50"]
# semantic memory embeddings (CPU). `sentence-transformers` runs BAAI/bge-m3;
# `fastembed` is a lighter ONNX alternative for smaller models.
memory = ["sentence-transformers>=3.0"]
memory-fastembed = ["fastembed>=0.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.1",
]
vec = [
    "sqlite-vec>=0.1.9",
]
slack = [
    "slack-bolt>=1.20,<2",
]
discord = [
    "discord-py>=2.4,<3",
]
# code-execution backends (optional drivers)
jupyter = ["jupyter-client>=8.6"]
e2b = ["e2b-code-interpreter>=1.0"]
ssh = ["paramiko>=3.4"]
modal = ["modal>=0.64"]
daytona = ["daytona>=0.20"]
vercel = ["vercel>=0.3"]
# remote filesystem
s3 = ["boto3>=1.35"]
# interactive terminal UI
tui = ["textual>=0.80"]
# computer-use: a headless Playwright browser (``computer_driver=playwright``)
browser = ["playwright>=1.48"]
# realtime voice: PydanticAI's realtime transport (``realtime_driver=pydantic_ai``)
realtime = ["pydantic-ai-slim[realtime]>=2.55.0,<3"]

[project.scripts]
agentkit = "agentkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agentkit"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# SQLModel/SQLAlchemy column stubs (`order_by`, `.desc`) and the `list` method
# name shadowing the builtin in class-body annotations are false positives here.
[[tool.mypy.overrides]]
module = [
    "agentkit.db.repositories",
    "agentkit.db.repositories.*",
    "agentkit.session",
    "agentkit.foundation.storage",
]
disable_error_code = ["arg-type", "attr-defined", "union-attr", "valid-type", "misc"]
