[project]
name = "agentkit"
version = "0.1.0"
description = "Opinionated, batteries-included building blocks for PydanticAI personal-assistant agents (CLI + Telegram, MCP + A2A, durable execution)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "agentkit" }]
dependencies = [
    "pydantic-ai>=2.55.0,<3",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "sqlalchemy-libsql>=0.2.0",
    "alembic>=1.14",
    "dbos>=3.2.0,<4",
    "fastmcp-slim[server]>=4.1.0,<5",
    "a2a-sdk>=1.2.2,<2",
    "aiogram>=3.15,<4",
    "typer>=0.15",
    "httpx>=0.28.1",
    "uvicorn>=0.32",
    "telegramify-markdown>=1.4.0",
    "python-dateutil>=2.9",
    "babel>=2.16",
    "croniter>=6.0",
]

[project.optional-dependencies]
observability = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
observability-phoenix = ["arize-phoenix>=8"]
prices = ["yfinance>=0.2.50"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agentkit"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# SQLModel/SQLAlchemy column stubs (`order_by`, `.desc`) and the `list` method
# name shadowing the builtin in class-body annotations are false positives here.
[[tool.mypy.overrides]]
module = ["agentkit.db.repositories", "agentkit.session"]
disable_error_code = ["arg-type", "attr-defined", "union-attr", "valid-type", "misc"]
